<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆码头 - 腾讯云TVP</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #0A1628 0%, #1A3558 40%, #2D1B4E 60%, #F4872C 85%, #FFB347 100%);
  color: #fff;
}

.screen {
  display: none;
  height: 100vh;
  height: 100dvh;
  position: relative;
}
.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ============ 开场页 ============ */
#start-screen {
  text-align: center;
  padding: 20px;
}

.start-logo {
  font-family: 'Arial Black', Arial, sans-serif;
  font-size: clamp(3rem, 12vw, 5rem);
  font-weight: 900;
  color: #C9A96E;
  letter-spacing: 6px;
  text-shadow: 0 0 15px rgba(201, 169, 110, 0.4);
  margin-bottom: 1.2rem;
}

.game-title {
  font-size: clamp(2rem, 8vw, 3.2rem);
  font-weight: bold;
  margin-bottom: 0.4rem;
  animation: neon-glow 2s ease-in-out infinite;
  text-shadow: 0 0 10px #D4A853, 0 0 20px #D4A853, 0 0 40px #F4872C;
  color: #FFE156;
}

.game-subtitle {
  font-size: clamp(0.9rem, 3.5vw, 1.1rem);
  color: #D4A853;
  margin-bottom: 2rem;
  opacity: 0.9;
}

.btn {
  padding: 14px 36px;
  font-size: 1.1rem;
  border: 2px solid #D4A853;
  background: rgba(212, 168, 83, 0.15);
  color: #FFE156;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
  text-shadow: 0 0 10px #D4A853;
  box-shadow: 0 0 15px rgba(212, 168, 83, 0.3), inset 0 0 15px rgba(212, 168, 83, 0.1);
  touch-action: manipulation;
}
.btn:active {
  background: rgba(212, 168, 83, 0.35);
  transform: scale(0.96);
}

/* ============ 游戏页 ============ */
#game-screen {
  padding: 15px 10px 10px;
  justify-content: center;
  gap: 0;
}

.game-header {
  text-align: center;
  margin-bottom: 12px;
}

.level-title {
  font-size: clamp(0.9rem, 3.8vw, 1.2rem);
  color: #FFE156;
  text-shadow: 0 0 12px #D4A853;
  display: block;
  margin-bottom: 8px;
}

.hud {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.hud-item {
  font-size: 0.8rem;
  color: #FFE156;
  text-shadow: 0 0 8px #D4A853;
  padding: 4px 10px;
  border: 1px solid rgba(212, 168, 83, 0.4);
  border-radius: 4px;
  background: rgba(10, 22, 40, 0.7);
}

/* ============ 卡牌网格 ============ */
.card-grid {
  display: grid;
  gap: 8px;
  justify-content: center;
  align-content: center;
  perspective: 1000px;
  width: 100%;
  max-width: 380px;
  padding: 0 8px;
}

.grid-2x4 { grid-template-columns: repeat(4, 1fr); }
.grid-3x4 { grid-template-columns: repeat(4, 1fr); }
.grid-4x4 { grid-template-columns: repeat(4, 1fr); }

/* ============ 卡牌 ============ */
.card {
  aspect-ratio: 3 / 4;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  width: 100%;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.card.animating {
  transition: transform 0.5s ease;
}

.card.flipped {
  transform: rotateY(180deg);
}

.card.matched {
  pointer-events: none;
}
.card.matched .card-front {
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
  border-color: #00FF88;
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-back {
  background: linear-gradient(145deg, #0B1D3A, #132848);
  border: 2px solid #D4A853;
  box-shadow: 0 0 8px rgba(212, 168, 83, 0.2);
}

.card-back-logo {
  font-family: 'Arial Black', Arial, sans-serif;
  font-size: clamp(1.1rem, 4.5vw, 1.6rem);
  font-weight: 900;
  color: #C9A96E;
  letter-spacing: 2px;
  text-shadow: 0 0 6px rgba(201, 169, 110, 0.3);
}

.card-front {
  background: linear-gradient(145deg, #1E3A5F, #2A4D7A);
  border: 2px solid var(--card-color, #D4A853);
  box-shadow: 0 0 10px var(--card-glow, rgba(212, 168, 83, 0.3)),
              inset 0 0 20px rgba(255, 255, 255, 0.05);
  transform: rotateY(180deg);
  padding: 6px;
}

.card-front .card-text {
  font-size: clamp(0.5rem, 2.2vw, 0.8rem);
  text-align: center;
  font-weight: bold;
  color: var(--card-color, #FFE156);
  text-shadow: 0 0 6px var(--card-glow, rgba(212, 168, 83, 0.5));
  line-height: 1.4;
  max-width: 100%;
}

/* ============ 动画 ============ */
@keyframes match-pulse {
  0%, 100% { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.05); }
}
.card.match-anim {
  animation: match-pulse 0.4s ease forwards;
}

@keyframes neon-glow {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}

/* ============ 弹窗 ============ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5, 10, 20, 0.88);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }

.modal {
  background: linear-gradient(145deg, #0F1A2E, #1A2744);
  border: 2px solid #D4A853;
  border-radius: 12px;
  padding: 28px 22px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 0 30px rgba(212, 168, 83, 0.2);
}
.modal h2 {
  color: #FFE156;
  font-size: 1.3rem;
  margin-bottom: 10px;
  text-shadow: 0 0 12px #D4A853;
}
.modal p {
  color: #ccc;
  margin-bottom: 18px;
  line-height: 1.6;
  font-size: 0.85rem;
}

/* ============ 通关页 ============ */
#complete-screen {
  text-align: center;
  padding: 20px 16px;
  justify-content: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.complete-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.complete-title {
  font-size: clamp(1.6rem, 6.5vw, 2.2rem);
  color: #FFE156;
  margin-bottom: 16px;
  text-shadow: 0 0 10px #D4A853, 0 0 20px #D4A853, 0 0 40px #F4872C;
  animation: neon-glow 1.5s ease-in-out infinite;
}

.info-card {
  background: linear-gradient(145deg, #0F1A2E, #1A2744);
  border: 2px solid #D4A853;
  border-radius: 10px;
  padding: 18px 16px;
  margin: 10px auto;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 0 15px rgba(212, 168, 83, 0.2);
}
.info-card h3 {
  color: #FFE156;
  font-size: 1rem;
  margin-bottom: 8px;
  text-shadow: 0 0 8px #D4A853;
}
.info-card p {
  color: #ddd;
  line-height: 1.7;
  font-size: 0.85rem;
}

/* ============ 验证码 ============ */
.code-card {
  background: linear-gradient(145deg, #0A0E1A, #111B2E);
  border: 2px solid;
  border-radius: 10px;
  padding: 18px 16px;
  margin: 10px auto;
  max-width: 320px;
  width: 100%;
  position: relative;
  overflow: hidden;
  animation: border-glow 2s ease-in-out infinite;
}

@keyframes border-glow {
  0%, 100% { border-color: #D4A853; box-shadow: 0 0 12px rgba(212, 168, 83, 0.3); }
  33% { border-color: #00E5FF; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3); }
  66% { border-color: #FF6B9D; box-shadow: 0 0 12px rgba(255, 107, 157, 0.3); }
}

.code-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(212, 168, 83, 0.03) 10px, rgba(212, 168, 83, 0.03) 20px);
  animation: stripe-move 3s linear infinite;
  pointer-events: none;
}
@keyframes stripe-move {
  0% { transform: translateX(0); }
  100% { transform: translateX(28px); }
}

.code-label {
  font-size: 0.75rem;
  color: #999;
  margin-bottom: 8px;
  position: relative;
}

.verification-code {
  font-size: clamp(1.3rem, 5.5vw, 1.8rem);
  font-weight: bold;
  font-family: 'Courier New', monospace;
  letter-spacing: 2px;
  padding: 6px;
  position: relative;
  animation: code-flash 0.8s ease-in-out infinite;
}

@keyframes code-flash {
  0%, 100% { color: #FFE156; text-shadow: 0 0 8px #D4A853, 0 0 16px #D4A853; }
  33% { color: #FFFFFF; text-shadow: 0 0 8px #fff, 0 0 16px #fff; }
  66% { color: #00E5FF; text-shadow: 0 0 8px #00E5FF, 0 0 16px #00E5FF; }
}

.code-time {
  font-size: 0.75rem;
  color: #aaa;
  margin-top: 6px;
  position: relative;
  font-family: 'Courier New', monospace;
}
.code-device {
  font-size: 0.7rem;
  color: #666;
  margin-top: 4px;
  position: relative;
}

.warning-text {
  color: #FFFFFF;
  font-size: 0.85rem;
  margin-top: 16px;
  max-width: 320px;
  width: 100%;
  line-height: 1.8;
  background: rgba(255, 60, 60, 0.2);
  border: 1px solid rgba(255, 100, 100, 0.5);
  border-radius: 6px;
  padding: 12px 14px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* ============ 已兑奖 ============ */
.redeemed-notice {
  text-align: center;
  padding: 20px;
}
.redeemed-notice h2 {
  color: #FFE156;
  font-size: 1.4rem;
  margin-bottom: 12px;
  text-shadow: 0 0 12px #D4A853;
}
.redeemed-notice p {
  color: #ccc;
  margin-bottom: 20px;
  font-size: 0.85rem;
}

/* ============ 海浪 ============ */
.wave-decoration {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 35px;
  pointer-events: none;
  z-index: 50;
  opacity: 0.5;
}
.wave-svg {
  width: 200%;
  height: 100%;
  animation: wave-scroll 8s linear infinite;
}
@keyframes wave-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

@media (min-width: 600px) {
  .card-grid { max-width: 420px; gap: 10px; }
  .card-back-logo { font-size: 1.6rem; }
}
</style>
</head>
<body>

<!-- ============ 开场页 ============ -->
<div id="start-screen" class="screen active">
  <div class="start-logo">TVP</div>
  <h1 class="game-title">记 忆 码 头</h1>
  <p class="game-subtitle">霓虹灯下的记忆挑战</p>
  <button class="btn" onclick="startGame()">开 始 游 戏</button>
</div>

<!-- ============ 游戏页 ============ -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <span class="level-title" id="level-title"></span>
    <div class="hud">
      <span class="hud-item" id="hud-timer" style="display:none;">⏱ <span id="timer-text">60</span>s</span>
      <span class="hud-item" id="hud-steps">👣 <span id="steps-text">0</span> 步</span>
    </div>
  </div>
  <div class="card-grid" id="card-grid"></div>
</div>

<!-- ============ 过关弹窗 ============ -->
<div class="modal-overlay" id="level-modal">
  <div class="modal">
    <h2 id="modal-title">🎉 过关！</h2>
    <p id="modal-text"></p>
    <button class="btn" onclick="nextLevel()">下一关</button>
  </div>
</div>

<!-- ============ 失败弹窗 ============ -->
<div class="modal-overlay" id="fail-modal">
  <div class="modal">
    <h2>⏱ 时间到！</h2>
    <p>别灰心，再试一次吧</p>
    <button class="btn" onclick="retryLevel()">重 试</button>
  </div>
</div>

<!-- ============ 通关页 ============ -->
<div id="complete-screen" class="screen"></div>

<!-- ============ 海浪 ============ -->
<div class="wave-decoration">
  <svg class="wave-svg" viewBox="0 0 1200 50" preserveAspectRatio="none">
    <path d="M0,25 C150,45 350,5 600,25 C850,45 1050,5 1200,25 L1200,50 L0,50 Z" fill="rgba(244,135,44,0.25)"/>
    <path d="M0,30 C200,48 400,12 600,30 C800,48 1000,12 1200,30 L1200,50 L0,50 Z" fill="rgba(244,135,44,0.15)"/>
  </svg>
</div>

<script>
// ============ 显示名 ============
const DISPLAY_NAMES = {
  '腾讯云TVP': '腾讯云TVP',
  '腾讯云开发者社区': '腾讯云开发者<br>社区',
  '腾讯云架构师技术同盟': '腾讯云架构师<br>技术同盟',
  'WorkBuddy': 'WorkBuddy',
  '腾讯iOA': '腾讯iOA',
  '腾讯元宝': '腾讯元宝',
  'Hy3': 'Hy3',
  'CloudQ': 'CloudQ'
};

// ============ 关卡配置 ============
const LEVELS = [
  {
    name: '第一关「霓虹初亮」',
    gridClass: 'grid-2x4',
    pairs: ['腾讯云TVP', '腾讯云开发者社区', '腾讯云架构师技术同盟', 'WorkBuddy'],
    time: null,
    preview: true
  },
  {
    name: '第二关「浪潮涌动」',
    gridClass: 'grid-3x4',
    pairs: ['腾讯云TVP', '腾讯云开发者社区', '腾讯云架构师技术同盟', 'WorkBuddy', '腾讯iOA', '腾讯元宝'],
    time: 60,
    preview: false
  },
  {
    name: '第三关「破晓时分」',
    gridClass: 'grid-4x4',
    pairs: ['腾讯云TVP', '腾讯云开发者社区', '腾讯云架构师技术同盟', 'WorkBuddy', '腾讯iOA', '腾讯元宝', 'Hy3', 'CloudQ'],
    time: 60,
    preview: false
  }
];

const CARD_COLORS = {
  '腾讯云TVP': { color: '#D4A853', glow: 'rgba(212,168,83,0.5)' },
  '腾讯云开发者社区': { color: '#4FC3F7', glow: 'rgba(79,195,247,0.5)' },
  '腾讯云架构师技术同盟': { color: '#FFA726', glow: 'rgba(255,167,38,0.5)' },
  'WorkBuddy': { color: '#FFE156', glow: 'rgba(255,225,86,0.5)' },
  '腾讯iOA': { color: '#00E5FF', glow: 'rgba(0,229,255,0.5)' },
  '腾讯元宝': { color: '#00FF88', glow: 'rgba(0,255,136,0.5)' },
  'Hy3': { color: '#E040FB', glow: 'rgba(224,64,251,0.5)' },
  'CloudQ': { color: '#B388FF', glow: 'rgba(179,136,255,0.5)' }
};

// ============ 游戏状态 ============
let state = {
  currentLevel: 0,
  cards: [],
  flippedCards: [],
  isLocked: false,
  matchCount: 0,
  steps: 0,
  timer: null,
  timeLeft: 0,
  totalPairs: 0,
  isReplay: false  // 标记是否为再玩一次
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============ 防重复兑奖 ============
function isRedeemed() {
  if (localStorage.getItem('tvp_redeemed') === 'true') return true;
  if (sessionStorage.getItem('tvp_redeemed') === 'true') return true;
  if (document.cookie.indexOf('tvp_redeemed=true') !== -1) return true;
  return false;
}

function markRedeemed() {
  localStorage.setItem('tvp_redeemed', 'true');
  localStorage.setItem('tvp_pass_time', Date.now().toString());
  sessionStorage.setItem('tvp_redeemed', 'true');
  const expires = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = `tvp_redeemed=true;expires=${expires};path=/`;
  try {
    const req = indexedDB.open('tvp_game', 1);
    req.onupgradeneeded = (e) => { e.target.result.createObjectStore('status'); };
    req.onsuccess = (e) => {
      const db = e.target.result;
      db.transaction('status', 'readwrite').objectStore('status').put(true, 'redeemed');
    };
  } catch(e) {}
}

function checkIndexedDB(callback) {
  try {
    const req = indexedDB.open('tvp_game', 1);
    req.onupgradeneeded = (e) => { e.target.result.createObjectStore('status'); };
    req.onsuccess = (e) => {
      const db = e.target.result;
      const get = db.transaction('status', 'readonly').objectStore('status').get('redeemed');
      get.onsuccess = () => { callback(!!get.result); };
      get.onerror = () => { callback(false); };
    };
    req.onerror = () => { callback(false); };
  } catch(e) { callback(false); }
}

// ============ 开始游戏 ============
function startGame() {
  if (isRedeemed()) {
    showScreen('complete-screen');
    renderRedeemedPage();
    return;
  }
  state.isReplay = false;
  state.currentLevel = 0;
  startLevel(0);
}

function startLevel(levelIndex) {
  const level = LEVELS[levelIndex];
  state.currentLevel = levelIndex;
  state.flippedCards = [];
  state.isLocked = false;
  state.matchCount = 0;
  state.steps = 0;
  state.totalPairs = level.pairs.length;

  if (state.timer) { clearInterval(state.timer); state.timer = null; }

  document.getElementById('level-title').textContent = level.name;
  document.getElementById('steps-text').textContent = '0';

  const timerEl = document.getElementById('hud-timer');
  if (level.time) {
    timerEl.style.display = 'inline';
    state.timeLeft = level.time;
    document.getElementById('timer-text').textContent = level.time;
  } else {
    timerEl.style.display = 'none';
  }

  let cards = [];
  level.pairs.forEach((name, idx) => {
    cards.push({ id: idx * 2, name, matched: false });
    cards.push({ id: idx * 2 + 1, name, matched: false });
  });
  state.cards = shuffleArray(cards);

  renderCards(level.gridClass);
  showScreen('game-screen');

  if (level.preview) {
    state.isLocked = true;
    document.querySelectorAll('.card').forEach(c => {
      c.classList.add('flipped');
    });
    setTimeout(() => {
      document.querySelectorAll('.card').forEach(c => {
        c.classList.add('animating');
        c.classList.remove('flipped');
      });
      state.isLocked = false;
      if (level.time) startTimer();
    }, 2000);
  } else {
    document.querySelectorAll('.card').forEach(c => {
      c.classList.add('animating');
    });
    if (level.time) startTimer();
  }
}

function renderCards(gridClass) {
  const grid = document.getElementById('card-grid');
  grid.className = 'card-grid ' + gridClass;
  grid.innerHTML = '';

  state.cards.forEach((card, index) => {
    const colors = CARD_COLORS[card.name] || { color: '#D4A853', glow: 'rgba(212,168,83,0.5)' };
    const displayText = DISPLAY_NAMES[card.name] || card.name;
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.index = index;
    el.style.setProperty('--card-color', colors.color);
    el.style.setProperty('--card-glow', colors.glow);

    el.innerHTML = `
      <div class="card-face card-back">
        <span class="card-back-logo">TVP</span>
      </div>
      <div class="card-face card-front">
        <span class="card-text">${displayText}</span>
      </div>
    `;

    el.addEventListener('pointerup', (e) => {
      e.preventDefault();
      handleCardClick(index, el);
    });

    grid.appendChild(el);
  });
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============ 翻牌 ============
function handleCardClick(index, el) {
  if (state.isLocked) return;
  if (state.cards[index].matched) return;
  if (el.classList.contains('flipped')) return;

  el.classList.add('flipped');
  state.flippedCards.push({ index, el });

  if (state.flippedCards.length === 2) {
    state.steps++;
    document.getElementById('steps-text').textContent = state.steps;
    state.isLocked = true;

    const [card1, card2] = state.flippedCards;
    const name1 = state.cards[card1.index].name;
    const name2 = state.cards[card2.index].name;

    if (name1 === name2) {
      state.cards[card1.index].matched = true;
      state.cards[card2.index].matched = true;
      card1.el.classList.add('matched', 'match-anim');
      card2.el.classList.add('matched', 'match-anim');
      state.matchCount++;
      state.flippedCards = [];
      state.isLocked = false;

      if (state.matchCount === state.totalPairs) {
        setTimeout(() => levelComplete(), 400);
      }
    } else {
      setTimeout(() => {
        card1.el.classList.remove('animating');
        card2.el.classList.remove('animating');
        void card1.el.offsetHeight;
        void card2.el.offsetHeight;
        card1.el.classList.remove('flipped');
        card2.el.classList.remove('flipped');

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card1.el.classList.add('animating');
            card2.el.classList.add('animating');
            state.flippedCards = [];
            state.isLocked = false;
          });
        });
      }, 800);
    }
  }
}

function startTimer() {
  state.timer = setInterval(() => {
    state.timeLeft--;
    document.getElementById('timer-text').textContent = state.timeLeft;
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      state.timer = null;
      state.isLocked = true;
      document.getElementById('fail-modal').classList.add('active');
    }
  }, 1000);
}

function levelComplete() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (state.currentLevel === LEVELS.length - 1) {
    // 最后一关通关
    if (state.isReplay) {
      // 再玩一次模式，不显示兑奖
      showReplayCompleteScreen();
    } else {
      // 首次通关，显示兑奖
      showCompleteScreen();
    }
  } else {
    document.getElementById('modal-title').textContent = '🎉 过关！';
    document.getElementById('modal-text').textContent = `用了 ${state.steps} 步完成！`;
    document.getElementById('level-modal').classList.add('active');
  }
}

function nextLevel() {
  document.getElementById('level-modal').classList.remove('active');
  startLevel(state.currentLevel + 1);
}

function retryLevel() {
  document.getElementById('fail-modal').classList.remove('active');
  startLevel(state.currentLevel);
}

// ============ 首次通关页（含兑奖码） ============
function showCompleteScreen() {
  markRedeemed();
  const deviceId = getDeviceId();

  document.getElementById('complete-screen').innerHTML = `
    <div class="complete-content">
      <h1 class="complete-title">🎊 恭喜通关 🎊</h1>
      <div class="info-card">
        <h3>📍 前往 7F 腾讯云TVP展位</h3>
        <p>请出示本页面给工作人员<br>即可参与 <strong style="color:#FFE156;">扭蛋机抽奖</strong> 🎰</p>
      </div>
      <div class="code-card">
        <p class="code-label">🔐 兑奖验证码</p>
        <div class="verification-code" id="verify-code"></div>
        <div class="code-time" id="code-time"></div>
        <div class="code-device">📱 设备已绑定</div>
      </div>
      <div class="warning-text">⚠️ 验证码持续变化，截图无效<br>每人仅限兑奖一次</div>
    </div>
  `;

  showScreen('complete-screen');
  startCodeRefresh(deviceId);
}

// ============ 再玩一次通关页（不含兑奖码） ============
function showReplayCompleteScreen() {
  document.getElementById('complete-screen').innerHTML = `
    <div class="complete-content">
      <h1 class="complete-title">🎊 再次通关 🎊</h1>
      <div class="info-card">
        <h3>🎉 挑战成功！</h3>
        <p>你已经是记忆高手了！<br>但每人仅限兑奖一次哦～</p>
      </div>
      <button class="btn" style="margin-top:20px;" onclick="replayGame()">再来一次</button>
    </div>
  `;
  showScreen('complete-screen');
}

// ============ 已兑奖页 ============
function renderRedeemedPage() {
  document.getElementById('complete-screen').innerHTML = `
    <div class="complete-content">
      <div class="redeemed-notice">
        <h2>🎉 您已参与过本次活动</h2>
        <p>感谢您对腾讯云TVP的关注！</p>
        <button class="btn" onclick="replayGame()">再玩一次（不可再兑奖）</button>
      </div>
    </div>
  `;
}

function replayGame() {
  state.isReplay = true;
  state.currentLevel = 0;
  startLevel(0);
}

// ============ 设备指纹 ============
function getDeviceId() {
  let stored = localStorage.getItem('tvp_device_id');
  if (stored) return stored;
  const raw = [
    navigator.userAgent, navigator.language,
    screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || '',
    getCanvasFingerprint()
  ].join('|');
  const id = hashCode(raw).toString(36);
  localStorage.setItem('tvp_device_id', id);
  return id;
}

function getCanvasFingerprint() {
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillText('TVP2025', 2, 2);
    return c.toDataURL().slice(-20);
  } catch (e) { return 'no-canvas'; }
}

function hashCode(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash + str.charCodeAt(i)) & 0x7FFFFFFF;
  }
  return hash;
}

function generateCode(deviceId, timestamp) {
  const period = Math.floor(timestamp / 10000);
  const seed = hashCode(deviceId + '-' + period + '-tvp2025');
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = 'TVP-';
  for (let i = 0; i < 4; i++) code += chars[Math.abs((seed >> (i * 5)) + i * 7) % chars.length];
  code += '-';
  for (let i = 4; i < 8; i++) code += chars[Math.abs((seed >> (i * 4)) + i * 3) % chars.length];
  return code;
}

let codeIntervals = [];
function startCodeRefresh(deviceId) {
  codeIntervals.forEach(id => clearInterval(id));
  codeIntervals = [];
  function update() {
    const codeEl = document.getElementById('verify-code');
    const timeEl = document.getElementById('code-time');
    if (!codeEl || !timeEl) return;
    codeEl.textContent = generateCode(deviceId, Date.now());
    const d = new Date();
    timeEl.textContent = '⏱ ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
  }
  update();
  codeIntervals.push(setInterval(update, 1000));
  codeIntervals.push(setInterval(() => {
    const el = document.getElementById('verify-code');
    if (el) el.textContent = generateCode(deviceId, Date.now());
  }, 10000));
}

// ============ 初始化 ============
(function init() {
  if (isRedeemed()) {
    showScreen('complete-screen');
    renderRedeemedPage();
    return;
  }
  checkIndexedDB((redeemed) => {
    if (redeemed) {
      localStorage.setItem('tvp_redeemed', 'true');
      sessionStorage.setItem('tvp_redeemed', 'true');
      showScreen('complete-screen');
      renderRedeemedPage();
    }
  });
})();
</script>
